<!doctype html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<meta
		name="viewport"
		content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
	>
	<meta http-equiv="X-UA-Compatible" content="ie=edge">
	<link rel="stylesheet" href="../../static/css/style.css">
	<title>Resultado do formulário</title>
</head>
<body class="form-result-page">
	{% block content %}
	<header class="header form-result-header">
		<div class="header__text form-result-header__text">
			<h1>Obrigado por preencher o formulário!</h1>
			<p>Recebemos seus dados e entraremos em contato em breve.</p>
		</div>
	</header>
	<main class="form-result-main">
		<section class="result-card">
			<h2>Dados recebidos</h2>
			<p><strong>Seu nome:</strong> {{ name }}</p>
			<p><strong>Seu email:</strong> {{ email }}</p>
			<p><strong>Seu endereço:</strong> {{ address }}</p>
			<p><strong>Data:</strong> {{ date }}</p>
			<a class="result-card__link" href="{{ url_for('form') }}">Preencher outro formulário</a>
		</section>
	</main>
	<footer>

	</footer>
	{% endblock %}
</body>
</html>
